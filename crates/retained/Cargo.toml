[package]
name = "wgpu-gameui-retained"
version.workspace = true
edition.workspace = true
description = "A retained, signal-driven tree on top of wgpu-gameui's draw lists (prototype)"
license.workspace = true
repository.workspace = true
# A prototype, to measure against immediate mode (docs/design/retained-mode.md).
publish = false

[dependencies]
slotmap = "1"
wgpu-gameui = { path = "../core" }

# The window the example draws into (docs/design/retained-mode.md, Phase 6).
[dev-dependencies]
pollster = "0.3"
wgpu = "24"
winit = "0.30"

# Its tests drive the example's tree without a window; `cargo test` runs them.
[[example]]
name = "retained_window"
test = true
