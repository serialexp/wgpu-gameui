a(0,0,0,0.5); color: #fff5f3; text-shadow: 0 -1px 0 rgba(0,0,0,0.35);\">12<\u002Fspan>\n        <span style=\"font-size: 11px; color: #7d858e;\">chip with count · notification bubble<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display: flex; flex-direction: column; border-radius: 1px; overflow: hidden; border: 1px solid rgba(0,0,0,0.65); box-shadow: inset 0 1px 3px rgba(0,0,0,0.45);\">\n        <div style=\"display: flex; align-items: center; gap: 9px; height: 24px; padding: 0 9px; background: rgba(255,255,255,0.016);\">\n          <span style=\"flex: 1; font-size: 11px; color: #cfd6dd;\">Terrain_Mesh<\u002Fspan>\n          <span style=\"padding: 1px 7px 2px; border-radius: 1px; font-family: 'IBM Plex Mono', monospace; font-size: 9px; letter-spacing: 0.08em; text-transform: uppercase; background: linear-gradient(180deg, oklch(0.44 0.09 75), oklch(0.53 0.11 75)); border: 1px solid rgba(0,0,0,0.65); box-shadow: inset 0 1px 3px rgba(0,0,0,0.5), 0 1px 0 rgba(255,255,255,0.07); color: oklch(0.93 0.11 85); text-shadow: 0 -1px 0 rgba(0,0,0,0.6);\">stale<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display: flex; align-items: center; gap: 9px; height: 24px; padding: 0 9px;\">\n          <span style=\"flex: 1; font-size: 11px; color: #cfd6dd;\">Bridge_A<\u002Fspan>\n          <span style=\"padding: 1px 7px 2px; border-radius: 1px; font-family: 'IBM Plex Mono', monospace; font-size: 9px; letter-spacing: 0.08em; text-transform: uppercase; background: linear-gradient(180deg, oklch(0.42 0.1 145), oklch(0.5 0.12 145)); border: 1px solid rgba(0,0,0,0.65); box-shadow: inset 0 1px 3px rgba(0,0,0,0.5), 0 1px 0 rgba(255,255,255,0.07); color: oklch(0.92 0.11 145); text-shadow: 0 -1px 0 rgba(0,0,0,0.6);\">baked<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display: flex; align-items: center; gap: 9px; height: 24px; padding: 0 9px; background: rgba(255,255,255,0.016);\">\n          <span style=\"flex: 1; font-size: 11px; color: #cfd6dd;\">Water_Volume<\u002Fspan>\n          <span style=\"padding: 1px 7px 2px; border-radius: 1px; font-family: 'IBM Plex Mono', monospace; font-size: 9px; letter-spacing: 0.08em; text-transform: uppercase; background: linear-gradient(180deg, rgba(0,0,0,0.45), rgba(255,255,255,0.05)); border: 1px solid rgba(0,0,0,0.6); box-shadow: inset 0 1px 2px rgba(0,0,0,0.55), 0 1px 0 rgba(255,255,255,0.06); color: #aeb6be; text-shadow: 0 -1px 0 rgba(0,0,0,0.7);\">draft<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <span style=\"font-size: 11px; line-height: 1.5; color: #7d858e; text-wrap: pretty;\">The chip never changes size between contexts — a 21px table row and a 26px status bar carry the identical badge. Only the count bubble differs, being round and lit from above rather than sunken, because it reports an arriving quantity rather than a resting state.<\u002Fspan>\n    <\u002Fdiv>\n\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"feedback\" style=\"display: flex; flex-direction: column; gap: 14px; margin-bottom: 40px; scroll-margin-top: 62px;\">\n    <div style=\"display: flex; flex-direction: column; gap: 4px; max-width: 760px;\">\n      <h2 style=\"margin: 0; font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: #9fb0b8;\">Feedback &amp; status<\u002Fh2>\n      <p style=\"margin: 0; font-size: 12px; line-height: 1.55; color: #7d858e; text-wrap: pretty;\">What the app says back. Transient at the top, persistent at the bottom, never both for one event.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 18px; align-items: start;\">\n\n    <!-- BANNER -->\n    <div style=\"display: flex; flex-direction: column; gap: 9px; padding: 14px; border-radius: 2px; background: rgba(16,19,22,0.72); border: 1px solid rgba(0,0,0,0.55); box-shadow: inset 0 1px 0 rgba(255,255,255,0.055);\">\n      <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 9px; letter-spacing: 0.16em; text-transform: uppercase; color: #6a737b;\">Banner<\u002Fspan>\n      <div style=\"display: flex; gap: 9px; padding: 9px 10px; border-radius: 1px; background: rgba(0,0,0,0.35); border: 1px solid rgba(0,0,0,0.6); border-left: 2px solid oklch(0.74 0.11 200); box-shadow: inset 0 1px 0 rgba(255,255,255,0.05);\">\n        <span style=\"font-size: 12px; color: oklch(0.78 0.1 200); line-height: 1.3;\">i<\u002Fspan>\n        <span style=\"font-size: 11.5px; line-height: 1.5; color: #cfd6dd; text-wrap: pretty;\">Lightmaps are stale. Rebake before exporting this level.<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display: flex; gap: 9px; padding: 9px 10px; border-radius: 1px; background: rgba(60,40,10,0.28); border: 1px solid rgba(0,0,0,0.6); border-left: 2px solid oklch(0.78 0.14 75); box-shadow: inset 0 1px 0 rgba(255,255,255,0.05);\">\n        <span style=\"font-size: 12px; color: oklch(0.82 0.13 75); line-height: 1.3;\">!<\u002Fspan>\n        <span style=\"font-size: 11.5px; line-height: 1.5; color: #e0d6c4; text-wrap: pretty;\">4 meshes exceed the 64k triangle budget.<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display: flex; gap: 9px; padding: 9px 10px; border-radius: 1px; background: rgba(70,15,15,0.3); border: 1px solid rgba(0,0,0,0.6); border-left: 2px solid oklch(0.62 0.18 25); box-shadow: inset 0 1px 0 rgba(255,255,255,0.05);\">\n        <span style=\"font-size: 12px; color: oklch(0.72 0.16 25); line-height: 1.3;\">×<\u002Fspan>\n        <span style=\"font-size: 11.5px; line-height: 1.5; color: #f0d2d2; text-wrap: pretty;\">Shader compile failed: <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 10.5px;\">water_caustics.wgsl:41<\u002Fspan><\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- TOASTS -->\n    <div style=\"display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: 2px; background: rgba(16,19,22,0.72); border: 1px solid rgba(0,0,0,0.55); box-shadow: i
