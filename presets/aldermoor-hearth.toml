# A first approximation of the "Aldermoor — Theme Proof" page (hearth era) in
# the Forge design project, as a re-skin of Forge: warm surfaces, parchment
# ink, a green accent and rounder corners. The bronze trim and the light
# parchment panels need the gaps in docs/design/theme-designer.md closed.
format = 1
name = "Aldermoor (hearth)"

[seeds]
density = 1.1
text_scale = 1.0
radius_scale = 3.0

[seeds.surface]
hue = 65.0
chroma = 1.3
lightness = 0.04

[seeds.ink]
hue = 85.0
chroma = 3.5
lightness = -0.02

[seeds.accent]
hue = 134.0
chroma = 1.0
lightness = -0.12

[seeds.danger]
hue = 25.0
chroma = 1.0
lightness = 0.0

[seeds.warning]
hue = 75.0
chroma = 1.0
lightness = 0.0

[seeds.success]
hue = 145.0
chroma = 1.0
lightness = 0.0

[seeds.info]
