<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="only light">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GPU chrome and shadow browser references</title>
<style>
  /* This fixture intentionally uses no text, web fonts, images, or SVG. */
  * { box-sizing: border-box; }
  html, body { margin: 0; min-width: max-content; min-height: max-content; }
  body { background: transparent; }
  #fixture-grid {
    display: grid;
    grid-template-columns: repeat(5, 288px);
    gap: 0;
    width: 1440px;
  }
  .fixture-case {
    position: relative;
    width: 288px;
    height: 280px;
    overflow: hidden;
    isolation: isolate;
  }
  .sample {
    position: absolute;
    left: 86px;
    top: 104px;
    width: 116px;
    height: 72px;
    background: rgb(212 218 229);
    border: 1px solid rgb(152 164 182);
    border-radius: var(--radius, 12px);
    box-shadow: var(--shadow);
    transform: var(--transform, none);
    transform-origin: center;
  }
  .thin .sample { width: 2px; height: 26px; left: 143px; top: 127px; border: 0; }
  .square .sample { --radius: 0px; }
  .r1 .sample { --radius: 1px; }
  .asymmetric .sample { border-radius: 2px 18px 7px 26px; }
  .collapsed .sample { width: 8px; height: 8px; left: 140px; top: 136px; }

  /* Composite captures use these known opaque backdrops. */
  body.capture-black { background: #000; }
  body.capture-white { background: #fff; }

  /* Alpha captures retain only CSS shadow coverage, not the opaque source. */
  body.capture-alpha .sample {
    background: transparent !important;
    border-color: transparent !important;
  }
</style>
</head>
<body>
<!-- Each fixture-case is one exact 288x280 crop named in manifest.json. -->
<main id="fixture-grid">
  <div class="fixture-case square" data-case="outset-blur-0" style="--shadow: 0 0 0 0 rgb(0 0 0 / 70%)"><div class="sample"></div></div>
  <div class="fixture-case r1" data-case="outset-blur-2" style="--shadow: 0 0 2px 0 rgb(0 0 0 / 70%)"><div class="sample"></div></div>
  <div class="fixture-case" data-case="outset-blur-6" style="--shadow: 0 0 6px 0 rgb(0 0 0 / 70%)"><div class="sample"></div></div>
  <div class="fixture-case" data-case="outset-blur-8" style="--shadow: 0 0 8px 0 rgb(0 0 0 / 70%)"><div class="sample"></div></div>
  <div class="fixture-case" data-case="outset-blur-18" style="--shadow: 0 0 18px 0 rgb(0 0 0 / 70%)"><div class="sample"></div></div>
  <div class="fixture-case" data-case="outset-blur-26" style="--shadow: 0 0 26px 0 rgb(0 0 0 / 70%)"><div class="sample"></div></div>
  <div class="fixture-case" data-case="outset-blur-40" style="--shadow: 0 0 40px 0 rgb(0 0 0 / 70%)"><div class="sample"></div></div>
  <div class="fixture-case" data-case="outset-blur-44" style="--shadow: 0 0 44px 0 rgb(0 0 0 / 70%)"><div class="sample"></div></div>
  <div class="fixture-case" data-case="offset-positive-xy" style="--shadow: 13px 17px 18px 0 rgb(0 0 0 / 70%)"><div class="sample"></div></div>
  <div class="fixture-case" data-case="offset-negative-xy" style="--shadow: -13px -17px 18px 0 rgb(0 0 0 / 70%)"><div class="sample"></div></div>
  <div class="fixture-case" data-case="offset-negative-x" style="--shadow: -18px 0 8px 0 rgb(0 0 0 / 70%)"><div class="sample"></div></div>
  <div class="fixture-case" data-case="offset-negative-y" style="--shadow: 0 -18px 8px 0 rgb(0 0 0 / 70%)"><div class="sample"></div></div>
  <div class="fixture-case asymmetric" data-case="spread-negative-asymmetric" style="--shadow: 5px -4px 18px -2px rgb(0 0 0 / 70%)"><div class="sample"></div></div>
  <div class="fixture-case asymmetric" data-case="spread-positive-asymmetric" style="--shadow: -5px 4px 18px 4px rgb(0 0 0 / 70%)"><div class="sample"></div></div>
  <div class="fixture-case" data-case="inset-basic" style="--shadow: inset 0 4px 8px 0 rgb(0 0 0 / 70%)"><div class="sample"></div></div>
  <div class="fixture-case collapsed" data-case="inset-hole-collapse" style="--shadow: inset 0 0 18px 8px rgb(0 0 0 / 70%)"><div class="sample"></div></div>
  <div class="fixture-case" data-case="cyan-glow" style="--shadow: 0 0 26px 4px rgb(0 220 255 / 65%)"><div class="sample"></div></div>
  <div class="fixture-case" data-case="mixed-multi-shadow" style="--shadow: 0 16px 40px rgb(0 0 0 / 70%), 0 2px 6px rgb(0 0 0 / 50%), inset 0 1px 0 rgb(255 255 255 / 12%), inset 0 -1px 0 rgb(0 0 0 / 50%)"><div class="sample"></div></div>
  <div class="fixture-case thin" data-case="thin-blur-40" style="--shadow: 0 0 40px 0 rgb(0 0 0 / 70%)"><div class="sample"></div></div>
  <div class="fixture-case thin" data-case="thin-blur-44" style="--shadow: 0 0 44px 0 rgb(0 0 0 / 70%)"><div class="sample"></div></div>
  <div class="fixture-case" data-case="transform-rotate" style="--shadow: 0 10px 18px 2px rgb(0 0 0 / 70%); --transform: rotate(27deg)"><div class="sample"></div></div>
  <div class="fixture-case" data-case="transform-nonuniform-scale" style="--shadow: 0 10px 18px 2px rgb(0 0 0 / 70%); --transform: scale(1.35, .65)"><div class="sample"></div></div>
  <div class="fixture-case" data-case="transform-skew" style="--shadow: 0 10px 18px 2px rgb(0 0 0 / 70%); --transform: skewX(24deg)"><div class="sample"></div></div>
  <div class="fixture-case asymmetric" data-case="transform-reflect-asymmetric" style="--shadow: 8px -6px 18px 4px rgb(0 0 0 / 70%); --transform: matrix(-1, .22, .18, 1, 0, 0)"><div class="sample"></div></div>
</main>
</body>
</html>
