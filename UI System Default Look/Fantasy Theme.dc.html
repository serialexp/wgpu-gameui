<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
<link href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,500;0,700;1,400&family=Alegreya+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#0d0c0b}
a{color:var(--accent-hi);text-decoration:none}
a:hover{color:var(--trim-hi)}
:root,[data-era="hearth"]{
  --bg:#171412; --bg2:#221d19;
  --chrome:#34383c; --chrome-hi:#575e64; --chrome-lo:#1c1f21;
  --trim:#8a6a3a; --trim-hi:#cba55f; --trim-lo:#54401f;
  --surface:#eadec4; --surface-2:#d8c7a1;
  --ink:#2c2317; --ink-2:#5b4b32; --ink-3:#8b7a55;
  --accent:#5a8340; --accent-hi:#93c264; --accent-lo:#2f4a1d;
  --well:#141618;
}
[data-era="industry"]{
  --bg:#121315; --bg2:#1b1d20;
  --chrome:#2f3235; --chrome-hi:#53585d; --chrome-lo:#181a1c;
  --trim:#9a7f42; --trim-hi:#dcbe71; --trim-lo:#5b4922;
  --surface:#e1e2da; --surface-2:#cbcec3;
  --ink:#22252a; --ink-2:#4d5258; --ink-3:#7b8189;
  --accent:#3f8f74; --accent-hi:#74cfac; --accent-lo:#1f5343;
  --well:#101113;
}
[data-era="arcane"]{
  --bg:#101219; --bg2:#181b25;
  --chrome:#2b2e3b; --chrome-hi:#51576b; --chrome-lo:#181a23;
  --trim:#8d92a8; --trim-hi:#d3d8ea; --trim-lo:#545a6e;
  --surface:#e5e8f1; --surface-2:#d0d5e3;
  --ink:#1d2030; --ink-2:#454b60; --ink-3:#737a90;
  --accent:#4aa88a; --accent-hi:#8aeac0; --accent-lo:#1f5a48;
  --well:#0c0e15;
}
[data-era]{--rowpad:13px}
[data-dense="1"]{--rowpad:7px}
[data-orn="0"] [data-orn-el]{display:none}
</style>
</helmet>
<div data-era="{{ era }}" data-orn="{{ ornFlag }}" data-dense="{{ denseFlag }}" style="min-height:100vh;padding:26px 26px 44px;background:radial-gradient(120% 90% at 50% -10%, var(--bg2) 0%, var(--bg) 62%, #0a0908 100%);font-family:'Alegreya Sans','Segoe UI',sans-serif;color:var(--surface)">

  <div style="max-width:1220px;margin:0 auto;display:flex;flex-direction:column;gap:22px">

    <div style="display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:18px;padding-bottom:16px;border-bottom:1px solid var(--trim-lo)">
      <div>
        <div style="font-family:Alegreya,Georgia,serif;font-size:31px;font-weight:700;letter-spacing:.01em;color:var(--surface);line-height:1.1">Aldermoor <span style="color:var(--trim-hi)">—</span> Theme Proof</div>
        <div style="margin-top:5px;font-size:14px;color:var(--ink-3);letter-spacing:.06em;text-transform:uppercase">{{ eraCaption }}</div>
      </div>
      <div style="display:flex;gap:8px;align-items:center">
        <div style="font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin-right:4px">Era</div>
        <sc-for list="{{ eraBtns }}" as="e" hint-placeholder-count="3">
          <sc-if value="{{ e.active }}" hint-placeholder-val="{{ true }}">
            <button onClick="{{ e.click }}" style="font:600 13px/1 'Alegreya Sans',sans-serif;letter-spacing:.09em;text-transform:uppercase;padding:9px 15px;border-radius:4px;cursor:pointer;color:#f2f6ea;border:1px solid var(--accent-lo);background:linear-gradient(180deg,var(--accent-hi) 0%,var(--accent) 55%,var(--accent-lo) 100%);text-shadow:0 1px 1px rgba(0,0,0,.45);box-shadow:0 1px 0 rgba(255,255,255,.28) inset,0 -2px 5px rgba(0,0,0,.4) inset,0 0 14px -2px var(--accent)">{{ e.label }}</button>
          </sc-if>
          <sc-if value="{{ e.idle }}" hint-placeholder-val="{{ true }}">
            <button onClick="{{ e.click }}" style="font:500 13px/1 'Alegreya Sans',sans-serif;letter-spacing:.09em;text-transform:uppercase;padding:9px 15px;border-radius:4px;cursor:pointer;color:var(--surface-2);border:1px solid var(--chrome-lo);background:linear-gradient(180deg,var(--chrome-hi) 0%,var(--chrome) 48%,var(--chrome-lo) 100%);text-shadow:0 1px 1px rgba(0,0,0,.5);box-shadow:0 1px 0 rgba(255,255,255,.16) inset,0 -2px 5px rgba(0,0,0,.35) inset,0 4px 9px -4px rgba(0,0,0,.6)" style-hover="filter:brightness(1.12)" style-active="transform:translateY(1px)">{{ e.label }}</button>
          </sc-if>
        </sc-for>
      </div>
    </div>

    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:22px;align-items:start">

      <div style="position:relative;background:linear-gradient(180deg,var(--chrome-hi) 0%,var(--chrome) 15%,var(--chrome-lo) 100%);border:1px solid var(--trim-lo);border-radius:7px;padding:9px;box-shadow:0 1px 0 rgba(255,255,255,.15) inset,0 -3px 8px rgba(0,0,0,.45) inset,0 14px 30px -10px rgba(0,0,0,.7)">
        <div data-orn-el="1" style="position:absolute;top:4px;left:4px;width:15px;height:15px;border-top:2px solid var(--trim);border-left:2px solid var(--trim);border-top-left-radius:5px;opacity:.85"></div>
        <div data-orn-el="1" style="position:absolute;top:4px;right:4px;width:15px;height:15px;border-top:2px solid var(--trim);border-right:2px solid var(--trim);border-top-right-radius:5px;opacity:.85"></div>
        <div data-orn-el="1" style="position:absolute;bottom:4px;left:4px;width:15px;height:15px;border-bottom:2px solid var(--trim);border-left:2px solid var(--trim);border-bottom-left-radius:5px;opacity:.85"></div>
        <div data-orn-el="1" style="position:absolute;bottom:4px;right:4px;width:15px;height:15px;border-bottom:2px solid var(--trim);border-right:2px solid var(--trim);border-bottom-right-radius:5px;opacity:.85"></div>
        <div style="display:flex;align-items:center;justify-content:center;gap:10px;padding:5px 8px 9px">
          <div data-orn-el="1" style="flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--trim))"></div>
          <div style="font-family:Alegreya,Georgia,serif;font-size:15px;font-weight:700;letter-spacing:.17em;text-transform:uppercase;color:var(--trim-hi);text-shadow:0 1px 2px rgba(0,0,0,.7)">Buttons</div>
          <div data-orn-el="1" style="flex:1;height:1px;background:linear-gradient(90deg,var(--trim),transparent)"></div>
        </div>
        <div style="background:linear-gradient(180deg,var(--surface) 0%,var(--surface-2) 100%);border:1px solid var(--trim-lo);border-radius:3px;box-shadow:0 3px 12px rgba(0,0,0,.55) inset;padding:17px;color:var(--ink);display:flex;flex-direction:column;gap:15px">
          <div style="display:flex;flex-wrap:wrap;gap:10px">
            <button style="font:700 14px/1 'Alegreya Sans',sans-serif;letter-spacing:.04em;padding:11px 19px;border-radius:4px;cursor:pointer;color:#241a09;border:1px solid var(--trim-lo);background:linear-gradient(180deg,var(--trim-hi) 0%,var(--trim) 54%,var(--trim-lo) 100%);text-shadow:0 1px 0 rgba(255,255,255,.34);box-shadow:0 1px 0 rgba(255,255,255,.45) inset,0 -3px 6px rgba(0,0,0,.35) inset,0 3px 6px -2px rgba(0,0,0,.5)" style-hover="filter:brightness(1.09)" style-active="transform:translateY(2px);box-shadow:0 2px 7px rgba(0,0,0,.5) inset">Construct</button>
            <button style="font:600 14px/1 'Alegreya Sans',sans-serif;letter-spacing:.04em;padding:11px 19px;border-radius:4px;cursor:pointer;color:var(--surface);border:1px solid var(--chrome-lo);background:linear-gradient(180deg,var(--chrome-hi) 0%,var(--chrome) 50%,var(--chrome-lo) 100%);text-shadow:0 1px 1px rgba(0,0,0,.55);box-shadow:0 1px 0 rgba(255,255,255,.18) inset,0 -3px 6px rgba(0,0,0,.4) inset,0 3px 6px -2px rgba(0,0,0,.45)" style-hover="filter:brightness(1.14)" style-active="transform:translateY(2px)">Survey</button>
            <button style="font:600 14px/1 'Alegreya Sans',sans-serif;letter-spacing:.04em;padding:11px 17px;border-radius:4px;cursor:pointer;color:var(--ink-2);border:1px solid rgba(0,0,0,.18);background:rgba(0,0,0,.05)" style-hover="background:rgba(0,0,0,.1);color:var(--ink)" style-active="transform:translateY(1px)">Cancel</button>
            <button disabled="{{ true }}" style="font:600 14px/1 'Alegreya Sans',sans-serif;letter-spacing:.04em;padding:11px 17px;border-radius:4px;color:var(--ink-3);border:1px solid rgba(0,0,0,.14);background:rgba(0,0,0,.03);cursor:not-allowed">Demolish</button>
          </div>
          <div style="height:1px;background:linear-gradient(90deg,transparent,rgba(0,0,0,.22),transparent)"></div>
          <div>
            <div style="font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-3);margin-bottom:8px">Tools</div>
            <div style="display:flex;gap:8px;flex-wrap:wrap">
              <sc-for list="{{ tools }}" as="t" hint-placeholder-count="5">
                <sc-if value="{{ t.active }}" hint-placeholder-val="{{ true }}">
                  <button onClick="{{ t.click }}" title="{{ t.name }}" style="width:46px;height:46px;font-size:19px;border-radius:4px;cursor:pointer;color:#f2f6ea;border:1px solid var(--accent-lo);background:linear-gradient(180deg,var(--accent-hi) 0%,var(--accent) 55%,var(--accent-lo) 100%);box-shadow:0 1px 0 rgba(255,255,255,.3) inset,0 -3px 6px rgba(0,0,0,.4) inset,0 0 16px -2px var(--accent);text-shadow:0 1px 2px rgba(0,0,0,.5)">{{ t.glyph }}</button>
                </sc-if>
                <sc-if value="{{ t.idle }}" hint-placeholder-val="{{ true }}">
                  <button onClick="{{ t.click }}" title="{{ t.name }}" style="width:46px;height:46px;font-size:19px;border-radius:4px;cursor:pointer;color:var(--surface-2);border:1px solid var(--chrome-lo);background:linear-gradient(180deg,var(--chrome-hi) 0%,var(--chrome) 50%,var(--chrome-lo) 100%);box-shadow:0 1px 0 rgba(255,255,255,.18) inset,0 -3px 6px rgba(0,0,0,.4) inset,0 3px 6px -2px rgba(0,0,0,.45);text-shadow:0 1px 2px rgba(0,0,0,.6)" style-hover="filter:brightness(1.15)" style-active="transform:translateY(2px)">{{ t.glyph }}</button>
                </sc-if>
              </sc-for>
            </div>
          </div>
          <div>
            <div style="font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-3);margin-bottom:8px">Segmented</div>
            <div style="display:inline-flex;padding:3px;gap:3px;border-radius:5px;background:linear-gradient(180deg,var(--chrome-lo),var(--chrome));border:1px solid var(--chrome-lo);box-shadow:0 2px 6px rgba(0,0,0,.4) inset">
              <sc-for list="{{ segs }}" as="s" hint-placeholder-count="3">
                <sc-if value="{{ s.active }}" hint-placeholder-val="{{ true }}">
                  <button onClick="{{ s.click }}" style="font:700 13px/1 'Alegreya Sans',sans-serif;letter-spacing:.07em;padding:9px 16px;border-radius:3px;cursor:pointer;color:#241a09;border:1px solid var(--trim-lo);background:linear-gradient(180deg,var(--trim-hi),var(--trim) 60%,var(--trim-lo));text-shadow:0 1px 0 rgba(255,255,255,.3);box-shadow:0 1px 0 rgba(255,255,255,.4) inset">{{ s.label }}</button>
                </sc-if>
                <sc-if value="{{ s.idle }}" hint-placeholder-val="{{ true }}">
                  <button onClick="{{ s.click }}" style="font:500 13px/1 'Alegreya Sans',sans-serif;letter-spacing:.07em;padding:9px 16px;border-radius:3px;cursor:pointer;color:var(--surface-2);border:1px solid transparent;background:transparent" style-hover="background:rgba(255,255,255,.07)">{{ s.label }}</button>
                </sc-if>
              </sc-for>
            </div>
          </div>
        </div>
      </div>

      <div style="position:relative;background:linear-gradient(180deg,var(--chrome-hi) 0%,var(--chrome) 15%,var(--chrome-lo) 100%);border:1px solid var(--trim-lo);border-radius:7px;padding:9px;box-shadow:0 1px 0 rgba(255,255,255,.15) inset,0 -3px 8px rgba(0,0,0,.45) inset,0 14px 30px -10px rgba(0,0,0,.7)">
        <div data-orn-el="1" style="position:absolute;top:4px;left:4px;width:15px;height:15px;border-top:2px solid var(--trim);border-left:2px solid var(--trim);border-top-left-radius:5px;opacity:.85"></div>
        <div data-orn-el="1" style="position:absolute;top:4px;right:4px;width:15px;height:15px;border-top:2px solid var(--trim);border-right:2px solid var(--trim);border-top-right-radius:5px;opacity:.85"></div>
        <div data-orn-el="1" style="position:absolute;bottom:4px;left:4px;width:15px;height:15px;border-bottom:2px solid var(--trim);border-left:2px solid var(--trim);border-bottom-left-radius:5px;opacity:.85"></div>
        <div data-orn-el="1" style="position:absolute;bottom:4px;right:4px;width:15px;height:15px;border-bottom:2px solid var(--trim);border-right:2px solid var(--trim);border-bottom-right-radius:5px;opacity:.85"></div>
        <div style="display:flex;align-items:center;justify-content:center;gap:10px;padding:5px 8px 9px">
          <div data-orn-el="1" style="flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--trim))"></div>
          <div style="font-family:Alegreya,Georgia,serif;font-size:15px;font-weight:700;letter-spacing:.17em;text-transform:uppercase;color:var(--trim-hi);text-shadow:0 1px 2px rgba(0,0,0,.7)">Fields</div>
          <div data-orn-el="1" style="flex:1;height:1px;background:linear-gradient(90deg,var(--trim),transparent)"></div>
        </div>
        <div style="background:linear-gradient(180deg,var(--surface) 0%,var(--surface-2) 100%);border:1px solid var(--trim-lo);border-radius:3px;box-shadow:0 3px 12px rgba(0,0,0,.55) inset;padding:17px;color:var(--ink);display:flex;flex-direction:column;gap:15px">
          <div>
            <div style="font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-3);margin-bottom:7px">Settlement name</div>
            <input value="{{ town }}" onChange="{{ onTown }}" style="width:100%;font:400 15px/1.2 Alegreya,Georgia,serif;color:var(--ink);padding:11px 12px;border-radius:3px;border:1px solid rgba(0,0,0,.35);background:rgba(255,255,255,.55);box-shadow:0 2px 5px rgba(0,0,0,.22) inset;outline:none" style-focus="border-color:var(--accent);box-shadow:0 2px 5px rgba(0,0,0,.2) inset,0 0 0 2px var(--accent-lo)">
          </div>
          <div>
            <div style="font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-3);margin-bottom:7px">Stockpile</div>
            <div style="display:flex;align-items:stretch;border-radius:3px;border:1px solid rgba(0,0,0,.35);background:rgba(255,255,255,.55);box-shadow:0 2px 5px rgba(0,0,0,.22) inset;overflow:hidden;width:150px">
              <button onClick="{{ dec }}" style="width:36px;font:700 17px/1 'Alegreya Sans',sans-serif;cursor:pointer;color:var(--surface);border:0;border-right:1px solid rgba(0,0,0,.3);background:linear-gradient(180deg,var(--chrome-hi),var(--chrome) 55%,var(--chrome-lo))" style-hover="filter:brightness(1.15)" style-active="transform:translateY(1px)">−</button>
              <div style="flex:1;display:flex;align-items:center;justify-content:center;font:600 16px/1 Alegreya,Georgia,serif;font-variant-numeric:tabular-nums;color:var(--ink)">{{ qty }}</div>
              <button onClick="{{ inc }}" style="width:36px;font:700 17px/1 'Alegreya Sans',sans-serif;cursor:pointer;color:var(--surface);border:0;border-left:1px solid rgba(0,0,0,.3);background:linear-gradient(180deg,var(--chrome-hi),var(--chrome) 55%,var(--chrome-lo))" style-hover="filter:brightness(1.15)" style-active="transform:translateY(1px)">+</button>
            </div>
          </div>
          <div style="height:1px;background:linear-gradient(90deg,transparent,rgba(0,0,0,.22),transparent)"></div>
          <div style="display:flex;flex-direction:column;gap:11px">
            <sc-for list="{{ checks }}" as="c" hint-placeholder-count="2">
              <div onClick="{{ c.click }}" style="display:flex;align-items:center;gap:10px;cursor:pointer;font-size:15px;color:var(--ink)">
                <sc-if value="{{ c.on }}" hint-placeholder-val="{{ true }}">
                  <span style="width:19px;height:19px;flex:none;border-radius:3px;border:1px solid var(--accent-lo);background:linear-gradient(180deg,var(--accent-hi),var(--accent) 60%,var(--accent-lo));box-shadow:0 1px 0 rgba(255,255,255,.35) inset,0 0 10px -2px var(--accent);display:flex;align-items:center;justify-content:center;color:#f4f8ec;font:700 13px/1 sans-serif;text-shadow:0 1px 1px rgba(0,0,0,.5)">✓</span>
                </sc-if>
                <sc-if value="{{ c.off }}" hint-placeholder-val="{{ true }}">
                  <span style="width:19px;height:19px;flex:none;border-radius:3px;border:1px solid rgba(0,0,0,.4);background:rgba(255,255,255,.5);box-shadow:0 2px 4px rgba(0,0,0,.25) inset"></span>
                </sc-if>
                {{ c.label }}
              </div>
            </sc-for>
          </div>
          <div style="height:1px;background:linear-gradient(90deg,transparent,rgba(0,0,0,.22),transparent)"></div>
          <div style="display:flex;flex-direction:column;gap:11px">
            <sc-for list="{{ radios }}" as="r" hint-placeholder-count="3">
              <div onClick="{{ r.click }}" style="display:flex;align-items:center;gap:10px;cursor:pointer;font-size:15px;color:var(--ink)">
                <sc-if value="{{ r.on }}" hint-placeholder-val="{{ true }}">
                  <span style="width:19px;height:19px;flex:none;border-radius:50%;border:1px solid rgba(0,0,0,.4);background:rgba(255,255,255,.5);box-shadow:0 2px 4px rgba(0,0,0,.25) inset;display:flex;align-items:center;justify-content:center"><span style="width:9px;height:9px;border-radius:50%;background:linear-gradient(180deg,var(--accent-hi),var(--accent-lo));box-shadow:0 0 9px -1px var(--accent)"></span></span>
                </sc-if>
                <sc-if value="{{ r.off }}" hint-placeholder-val="{{ true }}">
                  <span style="width:19px;height:19px;flex:none;border-radius:50%;border:1px solid rgba(0,0,0,.4);background:rgba(255,255,255,.5);box-shadow:0 2px 4px rgba(0,0,0,.25) inset"></span>
                </sc-if>
                {{ r.label }}
              </div>
            </sc-for>
          </div>
        </div>
      </div>

      <div style="position:relative;background:linear-gradient(180deg,var(--chrome-hi) 0%,var(--chrome) 15%,var(--chrome-lo) 100%);border:1px solid var(--trim-lo);border-radius:7px;padding:9px;box-shadow:0 1px 0 rgba(255,255,255,.15) inset,0 -3px 8px rgba(0,0,0,.45) inset,0 14px 30px -10px rgba(0,0,0,.7)">
        <div data-orn-el="1" style="position:absolute;top:4px;left:4px;width:15px;height:15px;border-top:2px solid var(--trim);border-left:2px solid var(--trim);border-top-left-radius:5px;opacity:.85"></div>
        <div data-orn-el="1" style="position:absolute;top:4px;right:4px;width:15px;height:15px;border-top:2px solid var(--trim);border-right:2px solid var(--trim);border-top-right-radius:5px;opacity:.85"></div>
        <div data-orn-el="1" style="position:absolute;bottom:4px;left:4px;width:15px;height:15px;border-bottom:2px solid var(--trim);border-left:2px solid var(--trim);border-bottom-left-radius:5px;opacity:.85"></div>
        <div data-orn-el="1" style="position:absolute;bottom:4px;right:4px;width:15px;height:15px;border-bottom:2px solid var(--trim);border-right:2px solid var(--trim);border-bottom-right-radius:5px;opacity:.85"></div>
        <div style="display:flex;align-items:center;justify-content:center;gap:10px;padding:5px 8px 9px">
          <div data-orn-el="1" style="flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--trim))"></div>
          <div style="font-family:Alegreya,Georgia,serif;font-size:15px;font-weight:700;letter-spacing:.17em;text-transform:uppercase;color:var(--trim-hi);text-shadow:0 1px 2px rgba(0,0,0,.7)">Sliders &amp; Meters</div>
          <div data-orn-el="1" style="flex:1;height:1px;background:linear-gradient(90deg,var(--trim),transparent)"></div>
        </div>
        <div style="background:linear-gradient(180deg,var(--surface) 0%,var(--surface-2) 100%);border:1px solid var(--trim-lo);border-radius:3px;box-shadow:0 3px 12px rgba(0,0,0,.55) inset;padding:17px;color:var(--ink);display:flex;flex-direction:column;gap:17px">
          <sc-for list="{{ demoSliders }}" as="s" hint-placeholder-count="3">
            <div>
              <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px">
                <div style="font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-3)">{{ s.label }}</div>
                <div style="font:600 14px/1 Alegreya,Georgia,serif;font-variant-numeric:tabular-nums;color:var(--ink-2)">{{ s.display }}</div>
              </div>
              <div onPointerDown="{{ s.onDown }}" style="position:relative;height:22px;display:flex;align-items:center;cursor:pointer;touch-action:none">
                <div style="position:absolute;left:0;right:0;top:6px;height:10px;border-radius:2px;overflow:hidden;background:linear-gradient(180deg,var(--chrome-lo),var(--chrome));border:1px solid rgba(0,0,0,.45);box-shadow:0 2px 5px rgba(0,0,0,.5) inset">
                  <div style="height:100%;width: {{ s.pct }};background:linear-gradient(180deg,var(--accent-hi),var(--accent) 55%,var(--accent-lo));box-shadow:0 1px 0 rgba(255,255,255,.28) inset"></div>
                </div>
                <div style="position:absolute;top:0;width:16px;height:22px;margin-left:-8px;border-radius:3px;left: {{ s.pct }};background:linear-gradient(180deg,var(--trim-hi),var(--trim) 55%,var(--trim-lo));border:1px solid var(--trim-lo);box-shadow:0 1px 0 rgba(255,255,255,.5) inset,0 2px 5px rgba(0,0,0,.55)"></div>
              </div>
            </div>
          </sc-for>
          <div style="height:1px;background:linear-gradient(90deg,transparent,rgba(0,0,0,.22),transparent)"></div>
          <sc-for list="{{ meters }}" as="m" hint-placeholder-count="3">
            <div>
              <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px">
                <div style="font-size:13px;color:var(--ink-2);font-family:Alegreya,Georgia,serif">{{ m.label }}</div>
                <div style="font:600 13px/1 Alegreya,Georgia,serif;font-variant-numeric:tabular-nums;color:var(--ink-3)">{{ m.display }}</div>
              </div>
              <div style="position:relative;height:13px;border-radius:2px;background:linear-gradient(180deg,var(--chrome-lo),var(--chrome));border:1px solid rgba(0,0,0,.45);box-shadow:0 2px 5px rgba(0,0,0,.5) inset;overflow:hidden">
                <div style="position:absolute;left:0;top:0;bottom:0;width: {{ m.pct }};background:linear-gradient(180deg,var(--accent-hi),var(--accent) 55%,var(--accent-lo));box-shadow:0 1px 0 rgba(255,255,255,.28) inset"></div>
              </div>
            </div>
          </sc-for>
        </div>
      </div>
    </div>

    <div style="position:relative;background:linear-gradient(180deg,var(--chrome-hi) 0%,var(--chrome) 15%,var(--chrome-lo) 100%);border:1px solid var(--trim-lo);border-radius:7px;padding:9px;box-shadow:0 1px 0 rgba(255,255,255,.15) inset,0 -3px 8px rgba(0,0,0,.45) inset,0 18px 40px -12px rgba(0,0,0,.75)">
      <div data-orn-el="1" style="position:absolute;top:4px;left:4px;width:18px;height:18px;border-top:2px solid var(--trim);border-left:2px solid var(--trim);border-top-left-radius:5px;opacity:.85"></div>
      <div data-orn-el="1" style="position:absolute;top:4px;right:4px;width:18px;height:18px;border-top:2px solid var(--trim);border-right:2px solid var(--trim);border-top-right-radius:5px;opacity:.85"></div>
      <div data-orn-el="1" style="position:absolute;bottom:4px;left:4px;width:18px;height:18px;border-bottom:2px solid var(--trim);border-left:2px solid var(--trim);border-bottom-left-radius:5px;opacity:.85"></div>
      <div data-orn-el="1" style="position:absolute;bottom:4px;right:4px;width:18px;height:18px;border-bottom:2px solid var(--trim);border-right:2px solid var(--trim);border-bottom-right-radius:5px;opacity:.85"></div>
      <div style="display:flex;align-items:center;justify-content:center;gap:12px;padding:6px 10px 11px">
        <div data-orn-el="1" style="flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--trim))"></div>
        <div data-orn-el="1" style="width:7px;height:7px;transform:rotate(45deg);background:linear-gradient(135deg,var(--trim-hi),var(--trim-lo));flex:none"></div>
        <div style="font-family:Alegreya,Georgia,serif;font-size:17px;font-weight:700;letter-spacing:.19em;text-transform:uppercase;color:var(--trim-hi);text-shadow:0 1px 2px rgba(0,0,0,.7)">Settings</div>
        <div data-orn-el="1" style="width:7px;height:7px;transform:rotate(45deg);background:linear-gradient(135deg,var(--trim-hi),var(--trim-lo));flex:none"></div>
        <div data-orn-el="1" style="flex:1;height:1px;background:linear-gradient(90deg,var(--trim),transparent)"></div>
      </div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:9px">
        <div style="max-width:100%;background:linear-gradient(180deg,var(--well),var(--chrome-lo));border:1px solid rgba(0,0,0,.5);border-radius:3px;box-shadow:0 3px 10px rgba(0,0,0,.5) inset;padding:7px;display:flex;flex-direction:column;gap:3px">
          <sc-for list="{{ cats }}" as="c" hint-placeholder-count="5">
            <sc-if value="{{ c.active }}" hint-placeholder-val="{{ true }}">
              <button onClick="{{ c.click }}" style="text-align:left;display:flex;align-items:center;gap:9px;font:700 14px/1 Alegreya,Georgia,serif;letter-spacing:.1em;text-transform:uppercase;padding:12px 12px;border-radius:2px;cursor:pointer;color:var(--surface);border:1px solid var(--chrome-lo);border-left:3px solid var(--accent-hi);background:linear-gradient(90deg,rgba(255,255,255,.1),rgba(255,255,255,.03));box-shadow:0 0 14px -4px var(--accent) inset"><span style="color:var(--accent-hi)">{{ c.glyph }}</span>{{ c.label }}</button>
            </sc-if>
            <sc-if value="{{ c.idle }}" hint-placeholder-val="{{ true }}">
              <button onClick="{{ c.click }}" style="text-align:left;display:flex;align-items:center;gap:9px;font:500 14px/1 Alegreya,Georgia,serif;letter-spacing:.1em;text-transform:uppercase;padding:12px 12px;border-radius:2px;cursor:pointer;color:var(--ink-3);border:1px solid transparent;border-left:3px solid transparent;background:transparent" style-hover="color:var(--surface-2);background:rgba(255,255,255,.05)"><span style="opacity:.7">{{ c.glyph }}</span>{{ c.label }}</button>
            </sc-if>
          </sc-for>
        </div>
        <div style="grid-column:span 2;min-width:0;background:linear-gradient(180deg,var(--surface) 0%,var(--surface-2) 100%);border:1px solid var(--trim-lo);border-radius:3px;box-shadow:0 3px 12px rgba(0,0,0,.55) inset;padding:6px 20px 18px;color:var(--ink)">
          <sc-for list="{{ rows }}" as="r" hint-placeholder-count="5">
            <div style="display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;padding:var(--rowpad) 0;border-bottom:1px solid rgba(0,0,0,.12)">
              <div style="min-width:170px;flex:1 1 170px">
                <div style="font:600 16px/1.2 Alegreya,Georgia,serif;color:var(--ink)">{{ r.label }}</div>
                <div style="font-size:13px;color:var(--ink-3);margin-top:2px">{{ r.hint }}</div>
              </div>
              <div style="flex:0 1 260px;min-width:170px;display:flex;justify-content:flex-end">
                <sc-if value="{{ r.isSwitch }}" hint-placeholder-val="{{ true }}">
                  <div onClick="{{ r.toggle }}" style="cursor:pointer">
                    <sc-if value="{{ r.on }}" hint-placeholder-val="{{ true }}">
                      <div style="width:56px;height:27px;border-radius:14px;padding:2px;background:linear-gradient(180deg,var(--accent-lo),var(--accent));border:1px solid var(--accent-lo);box-shadow:0 2px 5px rgba(0,0,0,.35) inset,0 0 13px -3px var(--accent);display:flex;justify-content:flex-end"><div style="width:23px;height:21px;border-radius:11px;background:linear-gradient(180deg,var(--trim-hi),var(--trim) 60%,var(--trim-lo));border:1px solid var(--trim-lo);box-shadow:0 1px 0 rgba(255,255,255,.5) inset,0 2px 4px rgba(0,0,0,.5)"></div></div>
                    </sc-if>
                    <sc-if value="{{ r.off }}" hint-placeholder-val="{{ true }}">
                      <div style="width:56px;height:27px;border-radius:14px;padding:2px;background:linear-gradient(180deg,var(--chrome-lo),var(--chrome));border:1px solid rgba(0,0,0,.45);box-shadow:0 2px 5px rgba(0,0,0,.5) inset"><div style="width:23px;height:21px;border-radius:11px;background:linear-gradient(180deg,#9aa0a6,#5f666c);border:1px solid rgba(0,0,0,.5);box-shadow:0 1px 0 rgba(255,255,255,.3) inset,0 2px 4px rgba(0,0,0,.5)"></div></div>
                    </sc-if>
                  </div>
                </sc-if>
                <sc-if value="{{ r.isSlider }}" hint-placeholder-val="{{ true }}">
                  <div style="display:flex;align-items:center;gap:12px;width:100%">
                    <div onPointerDown="{{ r.onDown }}" style="position:relative;flex:1;height:22px;display:flex;align-items:center;cursor:pointer;touch-action:none">
                      <div style="position:absolute;left:0;right:0;top:6px;height:10px;border-radius:2px;overflow:hidden;background:linear-gradient(180deg,var(--chrome-lo),var(--chrome));border:1px solid rgba(0,0,0,.45);box-shadow:0 2px 5px rgba(0,0,0,.5) inset">
                        <div style="height:100%;width: {{ r.pct }};background:linear-gradient(180deg,var(--accent-hi),var(--accent) 55%,var(--accent-lo));box-shadow:0 1px 0 rgba(255,255,255,.28) inset"></div>
                      </div>
                      <div style="position:absolute;top:0;width:16px;height:22px;margin-left:-8px;border-radius:3px;left: {{ r.pct }};background:linear-gradient(180deg,var(--trim-hi),var(--trim) 55%,var(--trim-lo));border:1px solid var(--trim-lo);box-shadow:0 1px 0 rgba(255,255,255,.5) inset,0 2px 5px rgba(0,0,0,.55)"></div>
                    </div>
                    <div style="width:52px;text-align:right;font:600 14px/1 Alegreya,Georgia,serif;font-variant-numeric:tabular-nums;color:var(--ink-2)">{{ r.display }}</div>
                  </div>
                </sc-if>
                <sc-if value="{{ r.isChoice }}" hint-placeholder-val="{{ true }}">
                  <div style="display:inline-flex;padding:3px;gap:3px;border-radius:4px;background:linear-gradient(180deg,var(--chrome-lo),var(--chrome));border:1px solid rgba(0,0,0,.5);box-shadow:0 2px 6px rgba(0,0,0,.45) inset">
                    <sc-for list="{{ r.options }}" as="o" hint-placeholder-count="3">
                      <sc-if value="{{ o.active }}" hint-placeholder-val="{{ true }}">
                        <button onClick="{{ o.click }}" style="font:700 13px/1 'Alegreya Sans',sans-serif;letter-spacing:.05em;padding:8px 13px;border-radius:2px;cursor:pointer;color:#241a09;border:1px solid var(--trim-lo);background:linear-gradient(180deg,var(--trim-hi),var(--trim) 60%,var(--trim-lo));text-shadow:0 1px 0 rgba(255,255,255,.3);box-shadow:0 1px 0 rgba(255,255,255,.4) inset">{{ o.label }}</button>
                      </sc-if>
                      <sc-if value="{{ o.idle }}" hint-placeholder-val="{{ true }}">
                        <button onClick="{{ o.click }}" style="font:500 13px/1 'Alegreya Sans',sans-serif;letter-spacing:.05em;padding:8px 13px;border-radius:2px;cursor:pointer;color:var(--surface-2);border:1px solid transparent;background:transparent" style-hover="background:rgba(255,255,255,.08)">{{ o.label }}</button>
                      </sc-if>
                    </sc-for>
                  </div>
                </sc-if>
                <sc-if value="{{ r.isKey }}" hint-placeholder-val="{{ true }}">
                  <div style="display:flex;gap:6px;align-items:center">
                    <sc-for list="{{ r.keys }}" as="k" hint-placeholder-count="2">
                      <div style="min-width:30px;padding:6px 8px;text-align:center;font:600 12px/1 'Alegreya Sans',sans-serif;color:var(--surface);border-radius:3px;border:1px solid var(--chrome-lo);background:linear-gradient(180deg,var(--chrome-hi),var(--chrome) 55%,var(--chrome-lo));box-shadow:0 1px 0 rgba(255,255,255,.18) inset,0 2px 3px rgba(0,0,0,.45)">{{ k }}</div>
                    </sc-for>
                  </div>
                </sc-if>
              </div>
            </div>
          </sc-for>
          <div style="display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end;padding-top:17px">
            <button style="font:600 14px/1 'Alegreya Sans',sans-serif;letter-spacing:.04em;padding:11px 18px;border-radius:4px;cursor:pointer;color:var(--ink-2);border:1px solid rgba(0,0,0,.2);background:rgba(0,0,0,.05)" style-hover="background:rgba(0,0,0,.1);color:var(--ink)" style-active="transform:translateY(1px)">Defaults</button>
            <button style="font:600 14px/1 'Alegreya Sans',sans-serif;letter-spacing:.04em;padding:11px 18px;border-radius:4px;cursor:pointer;color:var(--surface);border:1px solid var(--chrome-lo);background:linear-gradient(180deg,var(--chrome-hi),var(--chrome) 50%,var(--chrome-lo));text-shadow:0 1px 1px rgba(0,0,0,.55);box-shadow:0 1px 0 rgba(255,255,255,.18) inset,0 3px 6px -2px rgba(0,0,0,.45)" style-hover="filter:brightness(1.14)" style-active="transform:translateY(2px)">Cancel</button>
            <button style="font:700 14px/1 'Alegreya Sans',sans-serif;letter-spacing:.04em;padding:11px 22px;border-radius:4px;cursor:pointer;color:#241a09;border:1px solid var(--trim-lo);background:linear-gradient(180deg,var(--trim-hi),var(--trim) 54%,var(--trim-lo));text-shadow:0 1px 0 rgba(255,255,255,.34);box-shadow:0 1px 0 rgba(255,255,255,.45) inset,0 -3px 6px rgba(0,0,0,.35) inset,0 3px 6px -2px rgba(0,0,0,.5)" style-hover="filter:brightness(1.09)" style-active="transform:translateY(2px);box-shadow:0 2px 7px rgba(0,0,0,.5) inset">Accept</button>
          </div>
        </div>
      </div>
    </div>

    <div style="display:flex;flex-wrap:wrap;gap:9px;align-items:center;font-size:13px;color:var(--ink-3)">
      <span style="letter-spacing:.14em;text-transform:uppercase;font-size:11px">Palette</span>
      <sc-for list="{{ swatches }}" as="s" hint-placeholder-count="7">
        <div title="{{ s.name }}" style="display:flex;align-items:center;gap:7px;padding:5px 9px 5px 5px;border-radius:3px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07)">
          <span style="width:16px;height:16px;border-radius:2px;border:1px solid rgba(0,0,0,.4);background: {{ s.css }}"></span>
          <span style="font-size:12px;letter-spacing:.05em">{{ s.name }}</span>
        </div>
      </sc-for>
    </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;era&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;hearth&quot;,&quot;industry&quot;,&quot;arcane&quot;],&quot;default&quot;:&quot;hearth&quot;,&quot;tsType&quot;:&quot;'hearth'|'industry'|'arcane'&quot;,&quot;section&quot;:&quot;Theme&quot;},&quot;ornament&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Theme&quot;},&quot;dense&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Theme&quot;}}">
class Component extends DCLogic {
  state = {
    era: null, cat: 'Display', town: 'Aldermoor',
    master: 0.78, music: 0.42, zoom: 1.6,
    tax: 0.35, speed: 1.6, rations: 0.6,
    food: 0.64, wood: 0.31, favor: 0.88,
    tool: 'road', seg: 'Build', qty: 12,
    checks: { a: true, b: false, c: true },
    radio: 'Balanced',
    sw: { full: true, vsync: false, tips: true, blood: false, auto: true },
    choice: { quality: 'High', speed: 'Normal', scroll: 'Edge' }
  };

  era() { return this.state.era || this.props.era || 'hearth'; }

  drag(e, get, set, min, max, step) {
    const track = e.currentTarget;
    const apply = (ev) => {
      const r = track.getBoundingClientRect();
      let t = (ev.clientX - r.left) / r.width;
      t = Math.max(0, Math.min(1, t));
      let v = min + t * (max - min);
      if (step) v = Math.round(v / step) * step;
      set(v);
    };
    apply(e);
    const move = (ev) => apply(ev);
    const up = () => { window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up); };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  }

  slider(key, min, max, step) {
    return (e) => this.drag(e, null, (v) => this.setState({ [key]: v }), min, max, step);
  }

  pct(v, min, max) { return Math.round(((v - min) / (max - min)) * 100) + '%'; }

  renderVals() {
    const era = this.era();
    const orn = this.props.ornament === false ? '0' : '1';
    const dense = this.props.dense === true ? '1' : '0';
    const caption = {
      hearth: 'Hearth Age · slate, oak, bronze, parchment',
      industry: 'Industrial Age · blackened iron, brass, enamel',
      arcane: 'Arcane Age · basalt, silver, moonstone'
    }[era];

    const eraBtns = [['hearth', 'Hearth'], ['industry', 'Industry'], ['arcane', 'Arcane']].map(([id, label]) => ({
      label, active: era === id, idle: era !== id, click: () => this.setState({ era: id })
    }));

    const tools = [['road', 'Roads', '⌗'], ['house', 'Housing', '⌂'], ['farm', 'Farmland', '✦'], ['quarry', 'Quarry', '◈'], ['raze', 'Raze', '✕']]
      .map(([id, name, glyph]) => ({ name, glyph, active: this.state.tool === id, idle: this.state.tool !== id, click: () => this.setState({ tool: id }) }));

    const segs = ['Build', 'Zone', 'Decree'].map((label) => ({
      label, active: this.state.seg === label, idle: this.state.seg !== label, click: () => this.setState({ seg: label })
    }));

    const checks = [['a', 'Pause on new settler'], ['b', 'Auto-assign labour'], ['c', 'Show hauling routes']].map(([k, label]) => ({
      label, on: !!this.state.checks[k], off: !this.state.checks[k],
      click: () => this.setState({ checks: { ...this.state.checks, [k]: !this.state.checks[k] } })
    }));

    const radios = ['Peaceful', 'Balanced', 'Harsh'].map((label) => ({
      label, on: this.state.radio === label, off: this.state.radio !== label, click: () => this.setState({ radio: label })
    }));

    const demoSliders = [
      { label: 'Tax rate', display: Math.round(this.state.tax * 100) + '%', pct: this.pct(this.state.tax, 0, 1), onDown: this.slider('tax', 0, 1, 0.01) },
      { label: 'Game speed', display: this.state.speed.toFixed(1) + '×', pct: this.pct(this.state.speed, 0.5, 4), onDown: this.slider('speed', 0.5, 4, 0.1) },
      { label: 'Rations', display: Math.round(this.state.rations * 100) + '%', pct: this.pct(this.state.rations, 0, 1), onDown: this.slider('rations', 0, 1, 0.05) }
    ];

    const meters = [
      { label: 'Grain stores', display: Math.round(this.state.food * 1200) + ' / 1200', pct: this.pct(this.state.food, 0, 1) },
      { label: 'Timber', display: Math.round(this.state.wood * 800) + ' / 800', pct: this.pct(this.state.wood, 0, 1) },
      { label: 'Favour', display: Math.round(this.state.favor * 100) + '%', pct: this.pct(this.state.favor, 0, 1) }
    ];

    const cats = [['Display', '◈'], ['Audio', '♪'], ['Gameplay', '✦'], ['Controls', '⌗'], ['Interface', '☰']].map(([label, glyph]) => ({
      label, glyph, active: this.state.cat === label, idle: this.state.cat !== label, click: () => this.setState({ cat: label })
    }));

    const sw = (k, label, hint) => ({
      label, hint, isSwitch: true, on: !!this.state.sw[k], off: !this.state.sw[k],
      toggle: () => this.setState({ sw: { ...this.state.sw, [k]: !this.state.sw[k] } })
    });
    const choice = (k, label, hint, options) => ({
      label, hint, isChoice: true,
      options: options.map((o) => ({
        label: o, active: this.state.choice[k] === o, idle: this.state.choice[k] !== o,
        click: () => this.setState({ choice: { ...this.state.choice, [k]: o } })
      }))
    });
    const sl = (key, label, hint, min, max, step, fmt) => ({
      label, hint, isSlider: true, pct: this.pct(this.state[key], min, max),
      display: fmt(this.state[key]), onDown: this.slider(key, min, max, step)
    });

    const byCat = {
      Display: [
        sw('full', 'Fullscreen', 'Borderless window at desktop resolution'),
        sw('vsync', 'Vertical sync', 'Caps framerate to the monitor'),
        choice('quality', 'Shadow quality', 'Cost scales with settlement size', ['Low', 'High', 'Ultra']),
        sl('zoom', 'Camera zoom limit', 'How far out the map can be pulled', 0.5, 4, 0.1, (v) => v.toFixed(1) + '×')
      ],
      Audio: [
        sl('master', 'Master volume', 'All sound', 0, 1, 0.01, (v) => Math.round(v * 100) + '%'),
        sl('music', 'Music', 'Ambient score', 0, 1, 0.01, (v) => Math.round(v * 100) + '%'),
        sw('tips', 'Spoken advisors', 'Councillors read their warnings aloud')
      ],
      Gameplay: [
        choice('speed', 'Default speed', 'Applied on loading a save', ['Slow', 'Normal', 'Brisk']),
        sw('auto', 'Autosave', 'Keeps the last five seasons'),
        sw('blood', 'Harsh events', 'Plague, famine and raids'),
        sl('master', 'Difficulty bias', 'Weights every random event', 0, 1, 0.05, (v) => Math.round(v * 100) + '%')
      ],
      Controls: [
        choice('scroll', 'Map panning', 'How the camera follows the cursor', ['Edge', 'Drag', 'Keys']),
        { label: 'Open build menu', hint: 'Toggles the construction tray', isKey: true, keys: ['B'] },
        { label: 'Cycle season speed', hint: 'Hold to fast-forward', isKey: true, keys: ['Shift', 'Space'] },
        { label: 'Quick save', hint: 'Writes over the quick slot', isKey: true, keys: ['Ctrl', 'S'] }
      ],
      Interface: [
        sw('tips', 'Tooltips', 'Hover descriptions on every widget'),
        sw('full', 'Show resource ribbon', 'Pinned along the top edge'),
        choice('quality', 'Panel density', 'Row height across all lists', ['Compact', 'Cosy', 'Roomy'])
      ]
    };

    const swatches = [
      { name: 'chrome', css: 'var(--chrome)' },
      { name: 'trim', css: 'var(--trim)' },
      { name: 'trim hi', css: 'var(--trim-hi)' },
      { name: 'surface', css: 'var(--surface)' },
      { name: 'ink', css: 'var(--ink)' },
      { name: 'accent', css: 'var(--accent)' },
      { name: 'accent hi', css: 'var(--accent-hi)' }
    ];

    return {
      era, ornFlag: orn, denseFlag: dense, eraCaption: caption,
      eraBtns, tools, segs, checks, radios, demoSliders, meters, cats, swatches,
      rows: byCat[this.state.cat] || byCat.Display,
      town: this.state.town, onTown: (e) => this.setState({ town: e.target.value }),
      qty: this.state.qty,
      inc: () => this.setState({ qty: this.state.qty + 1 }),
      dec: () => this.setState({ qty: Math.max(0, this.state.qty - 1) })
    };
  }
}
</script>
</body>
</html>
