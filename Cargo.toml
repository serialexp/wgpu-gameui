[workspace]
# `designer/` is the theme designer, a binary built only from the library's
# widgets.
members = ["crates/core", "crates/media", "crates/code", "designer"]
resolver = "3"

# Every crate is released together at one version (just-release bumps it here).
[workspace.package]
version = "1.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/serialexp/wgpu-gameui"

# rust_h264 0.4.0 rounds chroma DC where the standard doesn't (chroma ±1 at low
# QP); the fix is on our fork's branch until it is released upstream.
[patch.crates-io]
rust_h264 = { git = "https://github.com/serialexp/rust_h264", branch = "fix/chroma-dc-dequant-rounding" }

# Glyph and icon MSDFs are generated on the CPU by fdsm; unoptimised, the
# atlas warm-up and the MSDF quality tests run about thirty times slower.
[profile.dev.package.fdsm]
opt-level = 3

# The sound is stretched and resampled as it plays; unoptimised, a debug
# build may not keep up with the device, and the converter tests run slowly.
[profile.dev.package.wsola]
opt-level = 3

[profile.dev.package.rubato]
opt-level = 3

[profile.dev.package.realfft]
opt-level = 3

[profile.dev.package.rustfft]
opt-level = 3
