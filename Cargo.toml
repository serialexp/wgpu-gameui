[workspace]
# `designer/` is the theme designer, a binary built only from the library's
# widgets.
members = ["crates/core", "crates/media", "designer"]
resolver = "3"

# Every crate is released together at one version (just-release bumps it here).
[workspace.package]
version = "1.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/serialexp/wgpu-gameui"

# Glyph and icon MSDFs are generated on the CPU by fdsm; unoptimised, the
# atlas warm-up and the MSDF quality tests run about thirty times slower.
[profile.dev.package.fdsm]
opt-level = 3
